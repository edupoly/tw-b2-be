<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form onsubmit="riseIssue(event)" name="tform">
        <input type="text" name="issueType">
        <br>
        <textarea name="remarks"></textarea>
        <br>
        <button>Rise Ticket</button>
    </form>
    <table border="2">
        <thead>
            <tr>
                <th>Type</th>
                <th>Remarks</th>
                <th>Status</th>
                <th>Time</th>
                <th>Operation</th>
            </tr>
        </thead>
        <tbody id="tbd">

        </tbody>
    </table>
    <script>
        function riseIssue(ev) {
            ev.preventDefault();
            var issueObject = {
                type: document.tform.issueType.value,
                remarks: document.tform.remarks.value
            }
            fetch("http://localhost:3600/riseTicket", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(issueObject)
            }).then(res => {
                getTickects()
            })
        }
        function getTickects() {
            fetch("http://localhost:3600/getAllTickets")
                .then(res => res.json())
                .then(data => {
                    var trs = "";
                    data.forEach((issue, i) => {
                        trs += `
                            <tr>
                                <td>${issue.type}</td>
                                <td>${issue.remarks}</td>
                                <td>${issue.status}...</td>
                                <td>${(new Date(issue.timeStamp)).toLocaleString()}</td>
                                <td>
                                    ${issue.status === 'pending' ? (`<button onclick="updateTicketStatus(${i},'processing')">Proceed</button>`) : ""}
                                    ${issue.status === 'processing' ? (`<button onclick="updateTicketStatus(${i},'closed')">Close</button>`) : ""}
                                    
                                    
                                    <button onclick="deleteTicket(${i})">Delete</button>
                                </td>
                            </tr>
                        `
                    })
                    document.getElementById("tbd").innerHTML = trs;
                })
        }
        getTickects()
        function deleteTicket(id) {
            fetch(`http://localhost:3600/deleteTicket/${id}`, {
                method: "DELETE"
            })
                .then(() => {
                    alert("Dlete ipoindi")
                    getTickects()
                })
        }
        function updateTicketStatus(id, status) {
            fetch(`http://localhost:3600/updateTicketStatus/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ status })
            })
                .then(() => {
                    alert("Processing Lo undi")
                    getTickects()
                })
        }
    </script>
</body>

</html>
